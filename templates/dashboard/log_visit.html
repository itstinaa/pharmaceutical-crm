<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Visit</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 32px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #0f766e;
        }

        form p {
            margin-bottom: 16px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-top: 6px;
            font-size: 14px;
        }

        button {
            background-color: #0f766e;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        a {
            margin-left: 12px;
            text-decoration: none;
            color: #374151;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Log Visit</h1>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save Visit</button>
            <a href="{% url 'sales_dashboard' %}">Cancel</a>
        </form>
    </div>
</body>
</html>
